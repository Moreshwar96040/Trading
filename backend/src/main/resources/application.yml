spring:
  application:
    name: trading-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${DB_USER:trading}
    password: ${DB_PASSWORD:trading}
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  market-data-service:
    base-url: ${MARKET_DATA_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${MARKET_DATA_SERVICE_TIMEOUT:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  candles:
    default-range-days: ${CANDLES_DEFAULT_RANGE_DAYS:365}
    max-range-days: ${CANDLES_MAX_RANGE_DAYS:3700}
  paper:
    commission-pct: ${PAPER_COMMISSION_PCT:0.05}

logging:
  level:
    com.tradingplatform: ${LOG_LEVEL:INFO}
